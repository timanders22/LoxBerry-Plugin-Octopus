; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Octopus Dynamic"
K02 = "The plugin fetches the <b>quarter-hour prices</b> of the <b>dynamicOctopus</b> tariff and makes them available to the Miniserver."
K03 = "First steps"
K04 = "<b>Settings → Octopus access:</b> enter your e-mail address, password and customer number and save. The customer number always begins with <code>A-</code> and appears at the top left of the Octopus dashboard or on any invoice.<br> <i>No Octopus contract?</i> Then switch on <b>demo mode</b> further down — the plugin will work with simulated values derived from the public exchange prices, and everything can be tested through completely."
K05 = "<b>Test → Check login</b> and <b>Fetch prices now.</b> If something fails, the message names the cause; the log contains the reply verbatim."
K06 = "<b>MQTT:</b> enter the subscription shown there in the MQTT gateway under <i>Subscriptions</i>. <b>Without that entry nothing arrives at the Miniserver.</b>"
K07 = "<b>Loxone integration:</b> work through the seven steps. Step 6 contains the complete list of blocks to rebuild it."
K08 = "Why is nothing added on top?"
K09 = "Octopus already supplies the finished <b>gross energy price</b>. Grid fees, levies and VAT are included. That is why there is no price breakdown to fill in here — it would be a source of error without any benefit."
K10 = "Why are tomorrow's prices empty?"
K11 = "Octopus only receives the exchange prices for the next day in the late afternoon. In the morning only today's are available. The topic <code>morgen_ok</code> goes to 1 as soon as they are there."
K12 = "The price display is empty"
K13 = "The interface only supplies prices while the <b>dynamicOctopus</b> tariff is running. Without that tariff an empty list comes back — that is not a fault of the plugin. The Test tab says so explicitly."
K14 = "The values in Loxone stop changing"
K15 = "Virtual inputs keep their last value. If the fetch fails, everything looks normal in the app — only the prices are no longer correct. That is why you should evaluate the topic <code>alter</code>: it counts the minutes since the last successful fetch. A threshold of 90 minutes reliably reports an outage without a single missed run raising an alarm."
K16 = "Where are my credentials kept?"
K17 = "In <code>config/plugins/octopus/zugang.json</code> with permissions 0600 — not in the configuration this interface displays. The password is never shown; an empty field deletes nothing. There is a separate tick box for deleting it."
K18 = "Resolution"
K19 = "Octopus supplies 15-minute values. The plugin publishes both: the quarter-hour values for fine control (<code>cur</code>, <code>rank</code>, <code>fenster_*</code>) and hourly averages for all blocks designed around hours (<code>cur_h</code>, <code>rank_h</code>). The cheapest window is searched on the quarter-hour grid and can therefore also begin at 13:45."
K20 = "Endpoint for the Miniserver"
K21 = "It sits in the unauthenticated area so that Loxone can reach it without credentials, and it is protected by a token. The token is generated on the first save and then stays put — it is embedded in the addresses on the Miniserver. If you roll a new one, you have to adjust those addresses."
