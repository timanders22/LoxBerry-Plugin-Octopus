[EM]
EINLEITUNG = "Zwei Bausteine kommen in Frage, und sie tun <b>nicht</b> dasselbe. Der <b>Spot Price Optimizer</b> rechnet mit Preisen und schaltet in den g&uuml;nstigsten Stunden. Der <b>Energiemanager</b> verteilt <b>&Uuml;berschuss</b> aus der PV-Anlage nach Priorit&auml;t - er hat keinen Preiseingang."
EM_HINWEIS = "Der Energiemanager kennt keinen Preis. Er sieht Netzbezug, Erzeugung, Speicherleistung und Ladezustand. Die Regeln dieses Plugins wirken deshalb nur mittelbar: sie erlauben Netzbezug, erzwingen einen Start oder heben den Mindestladestand. Wer <b>ausschlie&szlig;lich</b> preisgesteuert schalten will, h&auml;ngt den Regelausgang direkt an den Verbraucher - ganz ohne Energiemanager."
EM_TEXT = "Der Energiemanager verteilt &Uuml;berschuss. Die Schaltregeln greifen an drei Stellen ein - alle drei sind im Baustein verbindbare Eing&auml;nge:"
H_EM = "Energiemanager - er hat keinen Preiseingang"
H_SPOTOPT = "Spot Price Optimizer - hierher geh&ouml;rt das Stundenprofil"
H_TITEL = "Zusammenspiel mit den Energie-Bausteinen"
SPOTOPT_TEXT = "Diesen Baustein gibt es in Loxone Config bereits: er schaltet eine bestimmte Anzahl Stunden (<i>Bedarf</i>) innerhalb eines Zeitraums (<i>Periode</i>) zu den niedrigsten Preisen ein. Im Modus <b>Spot Markt</b> holt er B&ouml;rsenpreise selbst - das ist f&uuml;r Octopus aber der falsche Preis: der Tarif dynamicOctopus liefert bereits den fertigen <b>Bruttopreis</b> einschlie&szlig;lich aller Bestandteile, w&auml;hrend der Baustein B&ouml;rsenpreise ohne Steuern bekommt und eine Formel erwartet. Deshalb: Baustein auf <b>Absolut</b> oder <b>Relativ</b> stellen, Formelfeld leer lassen und die Werte von hier nehmen."
SPOTOPT_WARNUNG = "<b>Zweierlei ist zu beachten.</b> Erstens: Kommen die Preise von einem virtuellen HTTP-Eingang, benutzt der Baustein einen Wert nur, wenn er <b>innerhalb der laufenden Stunde</b> aktualisiert wurde - sonst verwirft er ihn als veraltet. Zweitens: Der Baustein rechnet in <b>ganzen Stunden</b>. Die Viertelstundenaufl&ouml;sung von Octopus geht dabei verloren. Wer sie braucht, nimmt die Schaltregeln dieses Plugins - die rechnen auf Viertelstunden."
T_ANSCHLUSS = "Anschluss am Baustein"
T_BEDEUTUNG = "Bedeutung"
T_VONHIER = "Von diesem Plugin"
Z_ABSOLUT = "Modus <b>Absolut</b>: je Eingang der Preis einer Tagesstunde. ph00 an 00:00, ph01 an 01:00 und so weiter."
Z_MINSOC = "Mindestladestand anheben, solange die Regel greift (z. B. 80 % statt 10 %). Der Speicher wird dann mit h&ouml;chster Priorit&auml;t geladen - zusammen mit einem positiven Offset auch aus dem Netz."
Z_OFF = "Sperren, wenn der Preis hoch ist: statt eines Verbrauchers den ganzen Baustein anhalten. Nur sinnvoll, wenn <b>alle</b> Lasten preisabh&auml;ngig sein sollen."
Z_OFFSET = "Netzbezug erlauben, solange die Regel greift. Ein positiver Wert in kW hei&szlig;t: es darf importiert werden - damit laufen Lasten auch ohne PV-&Uuml;berschuss."
Z_PRIO = "Nummer der Last (1-12) aufschalten, solange die Regel greift. Startet genau diese Last sofort. Mit einem Formel-Baustein: Regel aktiv &rarr; Lastnummer, sonst 0."
