Z_TRIGGER = "Ausl&ouml;ser f&uuml;r die Neuberechnung - z. B. der Tagesimpuls oder das Einstecken des Fahrzeugs. Ohne Ausl&ouml;ser rechnet der Baustein nicht neu."

