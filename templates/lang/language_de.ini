[LOX]
H_SCHRITTE = "Schritt f&uuml;r Schritt"
S1_T = "Schritt 1: Weg festlegen"
S1 = "<b>MQTT ist der Regelweg.</b> Der Gateway erzeugt die Namen der virtuellen Eing&auml;nge selbst; in Loxone gen&uuml;gt ein passend benannter virtueller Eingang. Der Weg &uuml;ber HTTP verlangt je Wert eine eigene Befehlserkennung und ist nur die R&uuml;ckfallebene &mdash; sinnvoll, wenn der Gateway bewusst nicht genutzt wird."
S2_T = "Schritt 2: Abo im MQTT-Gateway eintragen"
S2 = "System &rarr; MQTT Gateway &rarr; Reiter <b>Subscriptions</b> &rarr; diese Zeile hinzuf&uuml;gen und speichern:"
S2_WARN = "Ohne diesen Eintrag kommt am Miniserver nichts an."
S3_T = "Schritt 3: Virtuelle Eing&auml;nge anlegen"
S3 = "In Loxone Config unter <b>Virtuelle Eing&auml;nge</b> je gebrauchtem Wert einen Eingang anlegen. Der Titel muss genau so hei&szlig;en, wie der Gateway ihn bildet (Pr&auml;fix und Schr&auml;gstrich werden zu einem Unterstrich). Wer nicht alle braucht, legt nur die an, die er verwendet."
SP_TITEL = "Titel des virtuellen Eingangs"
SP_EINHEIT = "Einheit"
SP_BEDEUTUNG = "Bedeutung"
DL_MQTT = "Vorlage f&uuml;r virtuelle Eing&auml;nge (MQTT)"
DL_HTTP = "Vorlage f&uuml;r Befehlserkennung (HTTP)"
DL_HILFE = "Die heruntergeladene Datei in Loxone Config &uuml;ber <b>Datei &rarr; Vorlagen &rarr; Vorlage einf&uuml;gen</b> laden. Die HTTP-Vorlage enth&auml;lt das Token in der Adresse &mdash; wird das Token neu gew&uuml;rfelt, muss sie erneut geladen werden."
S4_T = "Schritt 4: Befehle senden"
S4 = "Das Plugin schaltet nichts, aber Loxone kann drei Aktionen ausl&ouml;sen. Daf&uuml;r einen <b>virtuellen Ausgang</b> anlegen (Adresse: die eigene LoxBerry-Adresse) und je Aktion einen virtuellen Ausgangsbefehl mit einer dieser Adressen:"
S5_T = "Schritt 5: Ausfallerkennung"
S5 = "Virtuelle Eing&auml;nge behalten ihren letzten Wert. F&auml;llt der Abruf aus, sieht in der App alles normal aus &mdash; nur die Preise stimmen nicht mehr. Deshalb <span class='sm-mono'>alter</span> auswerten: der Wert z&auml;hlt die Minuten seit dem letzten erfolgreichen Abruf. Ein Schwellwertschalter, der bei &uuml;ber 90 Minuten anspricht, meldet zuverl&auml;ssig einen Ausfall, ohne dass ein einzelner verpasster Durchlauf schon Alarm ausl&ouml;st (der Cron l&auml;uft minutlich, die Preise werden alle 15 Minuten neu geholt). Zus&auml;tzlich <span class='sm-mono'>ok</span> pr&uuml;fen &mdash; steht es auf 0, liegen &uuml;berhaupt keine Preise vor."
S6_T = "Schritt 6: Komplette Baustein-Liste zum Nachbauen"
S6 = "Diese Tabelle von oben nach unten abarbeiten &mdash; danach ist die Funktion nachgebaut. Die Bausteine findet man in Loxone Config &uuml;ber die Baustein-Suche (F5). Die Zeilen 15 bis 22 sind optional; wer nur den Preis anzeigen will, braucht die Zeilen 1 bis 12."
B_TYP = "Baustein (Typ)"
B_NAME = "Name (Vorschlag)"
B_PARAM = "Parameter"
B_EIN = "Eing&auml;nge verbinden mit"
B_ERKLAERUNG = "<b>Zu #6:</b> <span class='sm-mono'>alter</span> ist die einzige Gr&ouml;&szlig;e, die einen Ausfall sichtbar macht &mdash; alle anderen behalten ihren letzten Wert. <b>Zu #16:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Deshalb niemals mehrere Quellen direkt an seinen Eingang h&auml;ngen, sondern erst &uuml;ber ODER zusammenf&uuml;hren &mdash; sonst verschluckt eine dauerhaft aktive Quelle alle &uuml;brigen. <b>Zu #18:</b> Die Schwelle liegt bewusst deutlich &uuml;ber dem Abholtakt, damit ein einzelner verpasster Durchlauf keine Meldung ausl&ouml;st. <b>Zu #21:</b> Beim Original Loxone Audioserver l&auml;uft die Sprachausgabe &uuml;ber den Textgenerator, nicht &uuml;ber das Plugin."
