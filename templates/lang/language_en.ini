S7 = "Click <b>Send MQTT now</b> on the Test tab. Then look at the virtual inputs in Loxone Config: they must show the values displayed in the <b>current</b> column on the MQTT tab. If they differ, either the subscription is missing (step 2) or the title of the virtual input does not match. The button <b>Check endpoint</b> additionally calls the address from step 4 once without, once with a wrong and once with the correct token."

