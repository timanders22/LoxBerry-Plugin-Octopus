HTML = "HTML came back instead of JSON. That means a portal or an intermediate host answered, not the interface. So the fault is not with the credentials."
JSON = "The response was not readable JSON."
LEER = "The response was empty."
KEIN_ZUGANG = "No credentials are stored. Enter e-mail address and password on the Settings tab &mdash; or switch on demo mode."
ANMELDUNG = "Octopus rejected the login. Check e-mail address and password; the log contains the verbatim answer."
KEIN_TOKEN = "The login returned no token."
KEIN_KONTO = "No account number is stored. It is shown at the top left of the Octopus dashboard and starts with A-."
KONTOFORM = "The stored account number does not match the known form (A- followed by digits and/or letters)."
ABFRAGE = "The price query was rejected. The verbatim answer is in the log."
LEERE_LISTE = "The response contained no prices. This is exactly the case Octopus describes: the price display requires the dynamicOctopus tariff. Without that tariff an empty list is returned."
KEINE_PREISE = "There were entries in the response but no usable price inside them."
DEMO = "The exchange data for demo mode could not be loaded."
UNBEKANNT = "Unknown error. The log has the details."

[REGEL]
ART_FENSTER = "the N cheapest consecutive hours"
ART_MITTEL = "price X % below the daily average"
ART_SCHWELLE = "price below a fixed value"
ART_STUNDEN = "the N cheapest full hours"
ERKLAERUNG = "Up to 0.9.0 the plugin only delivered numbers: start time, minutes until then, average price. Turning that into &ldquo;charge now&rdquo; was work in the Miniserver. A switching rule answers the question here and outputs <b>a one or a zero</b>. Every rule knows a time window and a horizon, which makes &ldquo;the 3 cheapest hours between 22:00 and 06:00&rdquo; answerable. <b>Octopus works in quarter hours</b>: the rules operate on quarter-hour slots, so <span class='sm-mono'>in</span> and <span class='sm-mono'>rest</span> count in minutes. For &ldquo;cheapest full hours&rdquo; whole hours are averaged deliberately - otherwise the wallbox switches every 15 minutes."
H_AUSGANG = "Delivers <span class='sm-mono'>regel%d_aktiv</span> (0/1), <span class='sm-mono'>regel%d_in</span> (minutes until the next window), <span class='sm-mono'>regel%d_rest</span> (remaining minutes) and <span class='sm-mono'>regel%d_ct</span> (average in the window) - as an MQTT topic and in the Loxone template."
H_PROFIL = "The Loxone Spot Price Optimizer has <b>24</b> price inputs and does not accept quarter hours. The four quarter hours of each hour are therefore averaged. This changes nothing for the rules above - they keep working on quarter hours."
H_TITEL = "Switching rules - ready-made 0/1 signals for Loxone"
L_AKTIV = "Use switching rule %d"
L_ART = "Kind of rule"
L_BIS = "Time window until (hour)"
L_HORIZONT = "Horizon (next X hours)"
L_N = "Number of hours N"
L_NAME = "Name (appears in the template)"
L_NEG = "always switch on when the price is negative"
L_PROFIL = "Hourly profile for the Spot Price Optimizer"
L_PROZENT = "Distance from the daily average (%)"
L_SCHWELLE = "Fixed threshold (ct/kWh gross)"
L_VON = "Time window from (hour)"
P_NAME = "e.g. wallbox"
PROFIL_ABSOLUT = "absolute: ph00-ph23 today, pm00-pm23 tomorrow (48 values)"
PROFIL_AUS = "off - no hourly profile"
PROFIL_BEIDES = "both (72 values - only if really needed)"
PROFIL_RELATIV = "relative: pr00-pr23 from the current hour (24 values)"

[EM]
EINLEITUNG = "Two function blocks come into question, and they do <b>not</b> do the same thing. The <b>Spot Price Optimizer</b> works with prices and switches during the cheapest hours. The <b>Energy Manager</b> distributes <b>surplus</b> from the PV system by priority - it has no price input."
EM_HINWEIS = "The Energy Manager knows nothing about prices. It sees grid power, production, storage power and state of charge. The rules of this plugin therefore act only indirectly: they permit grid import, force a start, or raise the minimum state of charge. If you want switching driven <b>purely</b> by price, connect the rule output straight to the load - without the Energy Manager at all."
EM_TEXT = "The Energy Manager distributes surplus. The switching rules intervene at three points - all three are connectable inputs on the block:"
H_EM = "Energy Manager - it has no price input"
H_SPOTOPT = "Spot Price Optimizer - this is where the hourly profile belongs"
H_TITEL = "Working together with the energy function blocks"
SPOTOPT_TEXT = "This block already exists in Loxone Config: it activates a given number of hours (<i>Demand</i>) within a period (<i>Period</i>) at the lowest prices. In <b>Spot Market</b> mode it fetches exchange prices itself - but that is the wrong price for Octopus: the dynamicOctopus tariff already delivers the finished <b>gross price</b> including all components, whereas the block receives exchange prices without taxes and expects a formula. So: set the block to <b>Absolute</b> or <b>Relative</b>, leave the formula field empty and take the values from here."
SPOTOPT_WARNUNG = "<b>Two things to note.</b> First: if the prices come from a virtual HTTP input, the block only uses a value when it was updated <b>within the current hour</b> - otherwise it discards it as outdated. Second: the block works in <b>whole hours</b>. The quarter-hour resolution of Octopus is lost there. If you need it, use the switching rules of this plugin - they work on quarter hours."
T_ANSCHLUSS = "Connector on the block"
T_BEDEUTUNG = "Meaning"
T_VONHIER = "From this plugin"
Z_ABSOLUT = "<b>Absolute</b> mode: one input per hour of the day. ph00 to 00:00, ph01 to 01:00 and so on."
Z_MINSOC = "Raise the minimum state of charge while the rule applies (e.g. 80 % instead of 10 %). The storage is then charged with highest priority - together with a positive offset also from the grid."
Z_OFF = "Lock when the price is high: stop the whole block instead of a single load. Only sensible if <b>all</b> loads should depend on price."
Z_OFFSET = "Permit grid import while the rule applies. A positive value in kW means import is allowed - loads then run even without PV surplus."
Z_PRIO = "Feed the load number (1-12) while the rule applies. Starts exactly that load immediately. With a formula block: rule active - load number, otherwise 0."
Z_RELATIV = "<b>Relative</b> mode: one input per hour ahead. pr00 to +0, pr01 to +1 and so on."
Z_TRIGGER = "Trigger for the recalculation - e.g. the day pulse or plugging in the vehicle. Without a trigger the block does not recalculate."
