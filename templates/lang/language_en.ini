[LOX]
H_SCHRITTE = "Step by step"
S1_T = "Step 1: choose the path"
S1 = "<b>MQTT is the standard path.</b> The gateway generates the names of the virtual inputs itself; in Loxone a suitably named virtual input is enough. The HTTP path needs a separate command recognition per value and is only the fallback &mdash; useful if the gateway is deliberately not used."
S2_T = "Step 2: enter the subscription in the MQTT gateway"
S2 = "System &rarr; MQTT Gateway &rarr; tab <b>Subscriptions</b> &rarr; add this line and save:"
S2_WARN = "Without this entry nothing reaches the Miniserver."
S3_T = "Step 3: create the virtual inputs"
S3 = "In Loxone Config create one input under <b>Virtual inputs</b> for every value you need. The title must match exactly what the gateway builds (prefix and slash become an underscore). If you do not need them all, create only the ones you use."
SP_TITEL = "Title of the virtual input"
SP_EINHEIT = "Unit"
SP_BEDEUTUNG = "Meaning"
DL_MQTT = "Template for virtual inputs (MQTT)"
DL_HTTP = "Template for command recognition (HTTP)"
DL_HILFE = "Load the downloaded file in Loxone Config via <b>File &rarr; Templates &rarr; Insert template</b>. The HTTP template contains the token in the address &mdash; if the token is regenerated, it has to be loaded again."
S4_T = "Step 4: sending commands"
S4 = "The plugin switches nothing, but Loxone can trigger three actions. Create a <b>virtual output</b> for that (address: the LoxBerry address) and one virtual output command per action with one of these addresses:"
S5_T = "Step 5: failure detection"
S5 = "Virtual inputs keep their last value. If the fetch fails, everything looks normal in the app &mdash; only the prices are wrong. So evaluate <span class='sm-mono'>alter</span>: it counts the minutes since the last successful fetch. A threshold switch that trips above 90 minutes reliably reports a failure without a single missed run raising an alarm (the cron runs every minute, prices are refetched every 15 minutes). Also check <span class='sm-mono'>ok</span> &mdash; if it is 0, no prices are available at all."
S6_T = "Step 6: complete block list to rebuild"
S6 = "Work through this table from top to bottom &mdash; afterwards the function is rebuilt. The blocks are found in Loxone Config via the block search (F5). Rows 15 to 22 are optional; if you only want to display the price, rows 1 to 12 are enough."
B_TYP = "Block (type)"
B_NAME = "Name (suggestion)"
B_PARAM = "Parameters"
B_EIN = "Connect inputs to"
B_ERKLAERUNG = "<b>On #6:</b> <span class='sm-mono'>alter</span> is the only value that makes a failure visible &mdash; all others keep their last value. <b>On #16:</b> The notification block only fires on a change from off to on. So never attach several sources directly to its input, always merge them through an OR first &mdash; otherwise a permanently active source swallows all the others. <b>On #18:</b> The threshold is deliberately far above the fetch interval so that a single missed run does not raise an alarm. <b>On #21:</b> With the original Loxone Audioserver the voice output runs through the text generator, not through the plugin."
T_VE = "Virtual input"
T_STATUS = "Status"
T_SCHWELLE = "Threshold switch"
T_VERGLEICH = "Analogue value comparison"
T_ODER = "OR"
T_UND = "AND"
