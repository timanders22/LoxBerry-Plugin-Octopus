<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Electricity Price Chart Baseline -->
    <rect x="160" y="285" width="192" height="6" rx="3" fill="#ffffff" />

    <!-- Dynamic Electricity Price Bars (Hourly Market Curve) -->
    <rect x="168" y="235" width="10" height="50" rx="3" fill="#ffffff" />
    <rect x="183" y="250" width="10" height="35" rx="3" fill="#ffffff" />
    <rect x="198" y="262" width="10" height="23" rx="3" fill="#ffffff" />
    <rect x="213" y="270" width="10" height="15" rx="3" fill="#ffffff" />
    <rect x="228" y="260" width="10" height="25" rx="3" fill="#ffffff" />
    <rect x="243" y="245" width="10" height="40" rx="3" fill="#ffffff" />
    <rect x="258" y="225" width="10" height="60" rx="3" fill="#ffffff" />
    <rect x="273" y="190" width="10" height="95" rx="3" fill="#ffffff" />
    <rect x="288" y="155" width="10" height="130" rx="3" fill="#ffffff" />
    <rect x="303" y="175" width="10" height="110" rx="3" fill="#ffffff" />
    <rect x="318" y="205" width="10" height="80" rx="3" fill="#ffffff" />
    <rect x="333" y="220" width="10" height="65" rx="3" fill="#ffffff" />

    <!-- Lightning Bolt (Energy Signal) -->
    <polygon points="228,105 188,190 218,190 198,270 258,165 228,165" fill="#ffffff" />

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">Octopus Energy</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
