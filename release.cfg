[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und steuert
# das Auto-Update. Sie steht hier bewusst schon bereit, ist aber noch nicht
# scharf geschaltet: solange kein eigenes Repository existiert, bleiben
# ARCHIVEURL und INFOURL leer und AUTOMATIC_UPDATES in der plugin.cfg steht
# auf false.
#
# Beim ersten Release:
#   1. VERSION hier UND in plugin.cfg auf denselben Wert setzen
#   2. beide Adressen auf den Tag vX.Y.Z zeigen lassen
#   3. auf GitHub ein Release mit genau diesem Tag anlegen
#   4. AUTOMATIC_UPDATES in plugin.cfg auf true, RELEASECFG dort eintragen
#   5. nachpruefen: Tag ueber git/ref/tags/<Tag>, Release ueber releases,
#      und die Archivadresse gegen eine erfundene Fassung gegentesten -
#      die echte laedt herunter, die erfundene zeigt 404: Not Found
# Fehlt eine der Stellen, sieht LoxBerry das Update nicht oder laedt ein
# Archiv, das es nicht gibt.

VERSION=0.9.0
ARCHIVEURL=
INFOURL=
