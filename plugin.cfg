[AUTHOR]
NAME=Octopus Dynamic Plugin Authors
EMAIL=octopus-dynamic@users.noreply.github.com

[PLUGIN]
VERSION=0.9.0
NAME=octopus
FOLDER=octopus
TITLE=Octopus Dynamic

[AUTOUPDATE]
# Selbstaktualisierung ueber das eigene Repository. Die Adressen zeigen
# ausdruecklich NICHT auf ein fremdes Repository - sonst boete LoxBerry
# irgendwann ein Downgrade auf einen fremden Stand an (Hausregel, belegt am
# Docker-Plugin).
#
# Die Fassung steht bewusst noch auf 0.9.0: solange nicht an echter Gegenstelle
# erprobt, wird niemandem ein Update angeboten (0.9.0 = 0.9.0). Sobald 1.0.0
# erscheint, greift die Aktualisierung von selbst.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Octopus/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Octopus/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Ab LoxBerry 3 ist der MQTT-Gateway Bestandteil des Systems. Mit dieser
# Untergrenze entfaellt jede Fallunterscheidung im Code.
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
