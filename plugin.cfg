[AUTHOR]
NAME=Octopus Dynamic Plugin Authors
EMAIL=octopus-dynamic@users.noreply.github.com

[PLUGIN]
VERSION=0.9.0
NAME=octopus
FOLDER=octopus
TITLE=Octopus Dynamic

[AUTOUPDATE]
# Solange es kein eigenes Repository gibt, bleibt das Auto-Update AUS und die
# Adressen bleiben LEER. Andernfalls zeigt RELEASECFG auf einen fremden Stand,
# und LoxBerry bietet ein Downgrade auf ein fremdes Plugin an - das ist genau
# so schon einmal passiert.
# Beim Anlegen des Repositories: hier true setzen, beide Adressen eintragen
# und die Fassung in plugin.cfg UND release.cfg gemeinsam hochziehen.
AUTOMATIC_UPDATES=false
RELEASECFG=
PRERELEASECFG=

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Ab LoxBerry 3 ist der MQTT-Gateway Bestandteil des Systems. Mit dieser
# Untergrenze entfaellt jede Fallunterscheidung im Code.
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
